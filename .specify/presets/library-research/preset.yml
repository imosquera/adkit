schema_version: "1.0"

preset:
  id: "library-research"
  name: "Library Research"
  version: "1.2.0"
  description: "TypeScript/web half of the library-research pair (library-research-ios is the Swift half; both coexist in a mixed project). Wraps /speckit-plan so that, after the plan is written, the agent researches whether existing npm libraries can replace hand-rolled build-it-yourself surface area that the plan builds in TypeScript/JavaScript (web app, Node/Cloud Functions backend, scripts: auth, parsing, queues, retries, etc.) using live web search; Swift/iOS surface area is out of scope. Findings and a recommendation per unknown are written to this layer's own `## Library research — TypeScript/web` section of the shared research.md, never touching other sections; when a library is a clear win, only the TypeScript/web parts of plan.md are revised in place to reference it instead of a custom build. When the plan has no such surface area on this platform, writes only an N/A line in its own section and leaves plan.md alone. Chainable via {CORE_TEMPLATE} so it composes with other speckit.plan wrappers (e.g. parse-dont-validate, spec-minimal)."
  author: "imosquera"
  repository: "https://github.com/imosquera/speckit-squads"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

provides:
  scripts:
    - name: "jev.ts"
      file: "scripts/ts/jev.ts"
      command: "speckit.plan"
      executable: true

  templates:
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Composable wrapper for /speckit-plan that researches npm libraries for the plan's TypeScript/web technical unknowns via live web search, revises the web parts of plan.md, and writes its own section of research.md."
      strategy: "wrap"

tags:
  - "research"
  - "libraries"
  - "plan"
  - "web-search"
  - "build-vs-buy"
