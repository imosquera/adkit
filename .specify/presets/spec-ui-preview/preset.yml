schema_version: "1.0"

preset:
  id: "spec-ui-preview"
  name: "Spec UI Preview"
  version: "1.0.0"
  description: "Wraps /speckit-specify so that any feature touching user-facing UI carries a mandatory, GitHub-markdown-safe inline HTML preview as part of the requirement. The preview is written into a sentinel-delimited `## UI Preview (Requirement)` section so it can be regenerated idempotently. This preset does one thing: the UI preview. See presets/spec-ui-preview/README.md."
  author: "imosquera"
  repository: "https://github.com/imosquera/speckit-squads"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Composable wrapper for /speckit-specify that adds a mandatory, GitHub-safe inline HTML UI preview section for UI-touching features."
      strategy: "wrap"

tags:
  - "ui"
  - "preview"
  - "spec"
