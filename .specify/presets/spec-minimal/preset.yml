schema_version: "1.0"

preset:
  id: "spec-minimal"
  name: "Spec Minimal"
  version: "2.0.0"
  description: "Wraps /speckit-specify and /speckit-plan to enforce a strictly minimal artifact set. Specify drops Assumptions, Key Entities, and Success Criteria. Plan holds the feature directory to spec.md, plan.md, tasks.md, and optionally quickstart.md and research.md — data-model.md and contracts/ are forbidden by a mandatory prompt rule and guaranteed by a self-healing post-flight enforcer that folds any stray artifact into plan.md and removes it. See presets/spec-minimal/README.md for the canonical mechanism."
  author: "imosquera"
  repository: "https://github.com/imosquera/speckit-squads"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

provides:
  scripts:
    - name: "strip-spec-sections.sh"
      file: "scripts/bash/strip-spec-sections.sh"
      executable: true
      command: "speckit.specify"
    - name: "enforce-minimal-tree.sh"
      file: "scripts/bash/enforce-minimal-tree.sh"
      executable: true
      command: "speckit.plan"
    - name: "selftest-enforce-minimal-tree.sh"
      file: "scripts/bash/selftest-enforce-minimal-tree.sh"
      executable: true

  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Composable wrapper for /speckit-specify that trims Assumptions, Key Entities, and Success Criteria out of spec.md."
      strategy: "wrap"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Composable wrapper for /speckit-plan that holds the documentation tree to spec.md, plan.md, tasks.md, and optionally quickstart.md and research.md, with a self-healing post-flight enforcer."
      strategy: "wrap"

tags:
  - "spec-minimal"
  - "minimal"
  - "artifacts"
