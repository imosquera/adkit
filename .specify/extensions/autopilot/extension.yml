schema_version: "1.0"

extension:
  id: autopilot
  name: "Issue Backlog Autopilot"
  version: "0.4.1"
  description: "Take the highest-priority eligible open GitHub issue from backlog to a reviewed draft PR by driving the full speckit pipeline unattended (specify → clarify → plan → tasks → implement → review), auto-answering clarify questions, gating on the project's own build/test commands (web/Node/Python typecheck, tests, lint; or xcodebuild against an iOS Simulator / swift build/test for an iOS/Swift repo), and posting progress to the issue at every stage."
  author: imosquera
  license: MIT

requires:
  speckit_version: ">=0.2.0"
  tools:
    - name: git
      required: true
    - name: gh
      required: true
    - name: xcrun
      required: false

provides:
  scripts:
    - name: autopilot-schedule
      file: scripts/ts/autopilot-schedule.ts
      executable: true
    - name: autopilot-run
      file: scripts/ts/autopilot-run.ts
      executable: true
    - name: stream-decode
      file: scripts/ts/stream-decode.ts
      executable: true
    - name: bind-feature-issue
      file: scripts/ts/bind-feature-issue.ts
      executable: true
      command: speckit.autopilot.run
    - name: fetch-open-issues
      file: scripts/ts/fetch-open-issues.ts
      executable: true
      command: speckit.autopilot.run
    - name: preflight-issues
      file: scripts/ts/preflight-issues.ts
      executable: true
      command: speckit.autopilot.run
    - name: park-issue
      file: scripts/ts/park-issue.ts
      executable: true
      command: speckit.autopilot.run
    - name: check-target-repo
      file: scripts/ts/check-target-repo.ts
      executable: true
      command: speckit.autopilot.run
    - name: jev
      file: scripts/ts/jev.ts
      executable: true
      command: speckit.autopilot.run
    - name: sim-destination
      file: scripts/ts/sim-destination.ts
      executable: true
      command: speckit.autopilot.run
    - name: resolve-path
      file: scripts/ts/resolve-path.ts
      executable: true
    - name: py
      file: scripts/ts/py.ts
      executable: false

  commands:
    - name: speckit.autopilot.run
      file: commands/speckit.autopilot.run.md
      description: "Pick the highest-priority eligible open issue (or a given issue number), create its worktree, run the full speckit pipeline unattended, and open a draft PR that closes it"
    - name: speckit.autopilot.schedule
      file: commands/speckit.autopilot.schedule.md
      description: "Schedule /speckit-autopilot-run on a recurring launchd timer (default every 2h, configurable); also unschedule, status, or run-now. Opt-in, macOS only"

tags:
  - "workflow"
  - "github"
  - "automation"
  - "orchestration"
